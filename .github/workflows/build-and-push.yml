name: build-and-push

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Node.js 20 → 24 강제 옵트인 (2026-06-02 부터 기본). 경고 제거.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case owner
        id: o
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push (verbose, real exit code)
        run: |
          set -eo pipefail
          IMG="ghcr.io/${{ steps.o.outputs.lc }}/linchfin-domain"
          SHA7="${GITHUB_SHA:0:7}"
          # Pasture Dockerfile 의 ARG LINCHFIN_IMAGE 를 GHCR 의 linchfin-engine 으로 override.
          # (이전 build 가 docker.io/library/linchfin:latest 를 pull 시도하다 실패하던 원인 해소)
          LINCHFIN_IMG="ghcr.io/${{ steps.o.outputs.lc }}/linchfin-engine:develop"
          echo "Will build: $IMG:sha-$SHA7"
          echo "Using builder: $LINCHFIN_IMG"
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --build-arg "LINCHFIN_IMAGE=$LINCHFIN_IMG" \
            --tag "$IMG:sha-$SHA7" \
            --tag "$IMG:develop" \
            --push \
            --provenance=false \
            --progress=plain \
            . 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "BUILDX_EXIT=$BUILD_RC"
          exit "$BUILD_RC"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
