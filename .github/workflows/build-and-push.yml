name: build-and-push

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case owner
        id: o
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push (verbose, real exit code)
        run: |
          set -eo pipefail
          IMG="ghcr.io/${{ steps.o.outputs.lc }}/linchfin-domain"
          SHA7="${GITHUB_SHA:0:7}"
          echo "Will build: $IMG:sha-$SHA7"
          # 실제 build 결과를 직접 step exit 으로 전달.
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag "$IMG:sha-$SHA7" \
            --tag "$IMG:develop" \
            --push \
            --provenance=false \
            --progress=plain \
            . 2>&1 | tee /tmp/build.log
          # PIPESTATUS[0] = docker exit code (tee's exit is [1])
          BUILD_RC=${PIPESTATUS[0]}
          echo "BUILDX_EXIT=$BUILD_RC"
          exit "$BUILD_RC"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
