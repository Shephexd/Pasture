name: build-and-push

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Buildx + login + build (single step, all output captured)
        run: |
          set -x
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          sha7="${GITHUB_SHA:0:7}"
          IMG="ghcr.io/${owner_lc}/linchfin-domain"
          echo "::notice::building ${IMG}:sha-${sha7}"
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          docker buildx create --use --name builder || docker buildx use builder
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag "$IMG:sha-${sha7}" \
            --tag "$IMG:develop" \
            --push \
            --provenance=false \
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
