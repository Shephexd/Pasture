# 리포: Shephexd/Pasture  →  ghcr.io/<owner>/linchfin-domain
# 위치: .github/workflows/build-and-push.yml
#
# 주의: Pasture 는 Django + libgeos-dev + libpq-dev + nginx 가 들어가 빌드 사이즈가 큽니다.
#       amd64 네이티브 러너에서도 약 8~12분 예상.

name: build-and-push

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ["**.md", "docs/**", "scripts/**.csv", "scripts/**.xlsx"]
  workflow_dispatch:
    inputs:
      tag: { description: "Override tag", required: false }

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: linchfin-domain

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Hello sanity
        run: |
          echo "shell works"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REPOSITORY_OWNER=$GITHUB_REPOSITORY_OWNER"
          pwd
          uname -a
      - id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with: { platforms: linux/amd64 }
      - name: probe after qemu
        run: echo "probe after qemu OK"
      - uses: docker/setup-buildx-action@v3
      - name: probe after buildx
        run: echo "probe after buildx OK"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: probe after login
        run: echo "probe after login OK"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=sha,format=short
      - name: DEBUG metadata
        run: |
          echo "tags: ${{ steps.meta.outputs.tags }}"
          echo "labels: ${{ steps.meta.outputs.labels }}"
          echo "json: ${{ steps.meta.outputs.json }}"
      - name: BuildAndPush
        run: |
          {
            echo '## BuildAndPush log'
            echo '```'
            echo "step starts"
            IMG_BASE="ghcr.io/${{ steps.vars.outputs.owner_lc }}/linchfin-domain"
            SHA7="${{ steps.vars.outputs.sha7 }}"
            echo "IMG_BASE=$IMG_BASE"
            echo "SHA7=$SHA7"
            ls -la 2>&1 | head -20
            docker buildx version
            docker buildx build --platform linux/amd64 --file Dockerfile --push --provenance=false --tag "$IMG_BASE:sha-$SHA7" --tag "$IMG_BASE:develop" . 2>&1
            rc=$?
            echo "EXIT=$rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}
      - run: |
          echo "image: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}"
          echo "digest: ${{ steps.build.outputs.digest }}"
